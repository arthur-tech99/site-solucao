<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 620" fill="none">
  <defs>
    <linearGradient id="polo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f6fed"/>
      <stop offset="100%" stop-color="#12306e"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3b48c"/>
      <stop offset="100%" stop-color="#c8946a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="210" cy="230" rx="190" ry="190" fill="url(#glow)"/>

  <!-- legs -->
  <rect x="150" y="430" width="55" height="170" rx="20" fill="#1a2340"/>
  <rect x="215" y="430" width="55" height="170" rx="20" fill="#141b33"/>

  <!-- torso / polo -->
  <path d="M130 260 C130 210 165 185 210 185 C255 185 290 210 290 260 L300 450 C300 470 280 480 260 480 L160 480 C140 480 120 470 120 450 Z" fill="url(#polo)"/>
  <!-- collar -->
  <path d="M188 190 L210 230 L232 190" stroke="#0f1a3d" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- logo chip on chest -->
  <rect x="178" y="248" width="20" height="20" rx="4" fill="#7ec8ff"/>

  <!-- left arm bent holding tablet -->
  <path d="M138 265 C100 280 88 320 96 365 C100 388 118 400 140 396" stroke="url(#polo)" stroke-width="46" stroke-linecap="round" fill="none"/>
  <!-- right arm relaxed -->
  <path d="M282 265 C310 300 318 350 306 405" stroke="url(#polo)" stroke-width="46" stroke-linecap="round" fill="none"/>
  <!-- hand -->
  <circle cx="303" cy="412" r="24" fill="url(#skin)"/>

  <!-- tablet -->
  <rect x="70" y="330" width="110" height="150" rx="12" fill="#0b1230" stroke="#2f6fed" stroke-width="3"/>
  <rect x="82" y="344" width="86" height="100" rx="4" fill="#123a8f"/>
  <circle cx="125" cy="336" r="2.5" fill="#4fa3ff"/>
  <path d="M96 400 l16 -20 l14 14 l24 -30" stroke="#7ec8ff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- neck -->
  <rect x="192" y="150" width="36" height="45" rx="14" fill="url(#skin)"/>

  <!-- head -->
  <ellipse cx="210" cy="110" rx="58" ry="64" fill="url(#skin)"/>
  <!-- hair -->
  <path d="M152 100 C148 55 172 30 210 30 C250 30 272 56 268 100 C260 78 240 66 210 66 C180 66 160 78 152 100 Z" fill="#2a1e17"/>
  <!-- beard -->
  <path d="M162 108 C160 150 180 172 210 172 C240 172 260 150 258 108 C252 140 234 156 210 156 C186 156 168 140 162 108 Z" fill="#3a2a20" opacity="0.85"/>
  <!-- eyes -->
  <circle cx="188" cy="108" r="5" fill="#241a12"/>
  <circle cx="232" cy="108" r="5" fill="#241a12"/>
  <!-- smile -->
  <path d="M195 132 Q210 142 225 132" stroke="#241a12" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
